<!DOCTYPE html>
<html lang="en">
<head>
    <title>Orders</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: #f5f5f5; min-height: 100vh; color: #333; }

        .page-header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: #fff; padding: 1.2rem 2rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .page-header h1 { font-size: 1.5rem; font-weight: 800; }
        .page-header a { color: #fff; text-decoration: none; font-weight: 600; opacity: 0.9; }
        .page-header a:hover { opacity: 1; }

        .admin-toggle-btn {
            background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
            color: #fff; padding: 0.5rem 1.2rem; border-radius: 8px; cursor: pointer;
            font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.85rem;
            transition: all 0.2s;
        }
        .admin-toggle-btn:hover { background: rgba(255,255,255,0.25); }
        .admin-toggle-btn.logged-in { background: #27ae60; border-color: #27ae60; }

        .stats-row {
            max-width: 1200px; margin: 1.5rem auto; padding: 0 1.5rem;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;
        }
        .stat-card {
            background: #fff; border-radius: 12px; padding: 1.2rem 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .stat-card .stat-label { font-size: 0.78rem; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .stat-value { font-size: 1.8rem; font-weight: 800; margin-top: 0.2rem; }
        .stat-card .stat-value.revenue { color: #27ae60; }
        .stat-card .stat-value.orders { color: #3498db; }
        .stat-card .stat-value.items { color: #ff3838; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem 3rem; }
        .orders-list { display: flex; flex-direction: column; gap: 1rem; }

        .order-card {
            background: #fff; border-radius: 14px; overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .order-card-header {
            padding: 1rem 1.5rem; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #f0f0f0;
            flex-wrap: wrap; gap: 0.5rem;
        }
        .order-id-tag {
            background: #ff3838; color: #fff; font-size: 0.8rem; font-weight: 700;
            padding: 0.3rem 0.8rem; border-radius: 6px; letter-spacing: 1px;
        }
        .order-date { font-size: 0.85rem; color: #999; }
        .order-status {
            font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.7rem;
            border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .order-status.confirmed { background: #e8f5e9; color: #2e7d32; }
        .order-status.cancelled { background: #fce4ec; color: #c62828; }

        .order-card-body { padding: 1rem 1.5rem; }

        .customer-info {
            display: flex; gap: 2rem; flex-wrap: wrap;
            padding-bottom: 0.75rem; border-bottom: 1px solid #f5f5f5; margin-bottom: 0.75rem;
        }
        .customer-info .info-item { font-size: 0.85rem; }
        .customer-info .info-label { color: #999; font-size: 0.75rem; }
        .customer-info .info-value { font-weight: 700; color: #333; }

        .order-items-row {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.35rem 0; font-size: 0.85rem;
        }
        .order-items-row .oi-name { flex: 1; color: #555; }
        .order-items-row .oi-qty { color: #999; min-width: 40px; }
        .order-items-row .oi-price { font-weight: 700; color: #333; min-width: 60px; text-align: right; }

        .order-card-footer {
            padding: 0.75rem 1.5rem; background: #fafafa;
            display: flex; justify-content: space-between; align-items: center;
        }
        .order-total-label { font-size: 0.85rem; color: #999; }
        .order-total-amount { font-size: 1.2rem; font-weight: 800; color: #ff3838; }

        .admin-actions { display: flex; gap: 0.5rem; }
        .admin-actions button {
            padding: 0.4rem 1rem; border-radius: 6px; border: none; cursor: pointer;
            font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.78rem;
            transition: all 0.15s;
        }
        .btn-cancel-order { background: #fff3e0; color: #f57f17; }
        .btn-cancel-order:hover { background: #ffe0b2; }
        .btn-delete-order { background: #fce4ec; color: #c62828; }
        .btn-delete-order:hover { background: #f8bbd0; }
        .btn-restore-order { background: #e8f5e9; color: #2e7d32; }
        .btn-restore-order:hover { background: #c8e6c9; }

        .loading { text-align: center; padding: 4rem; color: #aaa; font-size: 1.1rem; }
        .loading i { font-size: 2rem; margin-bottom: 1rem; display: block; }
        .no-orders { text-align: center; padding: 4rem; color: #aaa; }
        .no-orders i { font-size: 3rem; margin-bottom: 1rem; display: block; color: #ddd; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 10000;
            justify-content: center; align-items: center; padding: 1rem;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: #fff; border-radius: 16px; max-width: 480px; width: 100%;
            animation: slideUp 0.3s ease; overflow: hidden;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            padding: 1.5rem; border-bottom: 1px solid #f0f0f0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h2 { font-size: 1.1rem; font-weight: 800; color: #222; }
        .modal-close {
            background: none; border: none; font-size: 1.2rem; color: #999;
            cursor: pointer; padding: 0.3rem;
        }
        .modal-close:hover { color: #333; }

        .modal-body { padding: 1.5rem; }

        .input-group { margin-bottom: 1rem; }
        .input-group label {
            display: block; font-size: 0.8rem; font-weight: 700; color: #555;
            margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .input-group input, .input-group select {
            width: 100%; padding: 0.7rem 0.9rem; border: 2px solid #eee;
            border-radius: 10px; font-size: 0.9rem; font-family: 'Nunito', sans-serif;
            outline: none; color: #333; transition: border-color 0.2s; background: #fff;
        }
        .input-group input:focus, .input-group select:focus { border-color: #3498db; }

        .form-row { display: flex; gap: 1rem; }
        .form-row .input-group { flex: 1; }

        .modal-btn {
            width: 100%; padding: 0.8rem; border: none; border-radius: 10px;
            font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.95rem;
            cursor: pointer; transition: all 0.15s; color: #fff;
        }
        .modal-btn.login { background: linear-gradient(135deg, #2c3e50, #3498db); }
        .modal-btn.login:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(52,152,219,0.3); }
        .modal-btn.success { background: #27ae60; margin-top: 0.5rem; }
        .modal-btn.success:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(39,174,96,0.3); }
        .modal-btn.offer-btn { background: linear-gradient(135deg, #e65100, #ff9800); margin-top: 0.5rem; }
        .modal-btn.offer-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(255,152,0,0.3); }

        .modal-error {
            background: #fce4ec; color: #c62828; padding: 0.6rem; border-radius: 8px;
            font-size: 0.8rem; font-weight: 600; margin-bottom: 1rem; text-align: center;
            display: none;
        }
        .modal-error.show { display: block; }

        .modal-success {
            background: #e8f5e9; color: #2e7d32; padding: 0.6rem; border-radius: 8px;
            font-size: 0.8rem; font-weight: 600; margin-bottom: 1rem; text-align: center;
            display: none;
        }
        .modal-success.show { display: block; }

        /* Admin Panel */
        .admin-panel {
            display: none; max-width: 1200px; margin: 0 auto 1.5rem;
            padding: 0 1.5rem;
        }
        .admin-panel.active { display: block; }

        .admin-panel-card {
            background: #fff; border-radius: 14px; overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .admin-panel-header {
            padding: 1rem 1.5rem; border-bottom: 1px solid #f0f0f0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .admin-panel-header h3 { font-size: 1rem; font-weight: 700; color: #222; }
        .admin-panel-body { padding: 1.25rem 1.5rem; }

        .admin-list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.6rem 0; border-bottom: 1px solid #f5f5f5; font-size: 0.88rem;
            flex-wrap: wrap; gap: 0.5rem;
        }
        .admin-list-item:last-child { border-bottom: none; }
        .admin-email { font-weight: 600; color: #333; }
        .admin-role {
            font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem;
            border-radius: 4px; text-transform: uppercase;
        }
        .admin-role.super { background: #fff3e0; color: #e65100; }
        .admin-role.admin { background: #e3f2fd; color: #1565c0; }

        .admin-controls { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

        .perm-toggle {
            display: flex; align-items: center; gap: 0.3rem; font-size: 0.72rem;
            color: #777; background: #f9f9f9; padding: 0.25rem 0.6rem; border-radius: 6px;
        }
        .perm-toggle input[type="checkbox"] {
            width: 15px; height: 15px; cursor: pointer; accent-color: #e65100;
        }

        .btn-remove-admin {
            background: #fce4ec; color: #c62828; border: none; padding: 0.3rem 0.8rem;
            border-radius: 6px; cursor: pointer; font-family: 'Nunito', sans-serif;
            font-weight: 700; font-size: 0.75rem; transition: all 0.15s;
        }
        .btn-remove-admin:hover { background: #f8bbd0; }

        .add-admin-row {
            display: flex; gap: 0.5rem; margin-top: 1rem; padding-top: 1rem;
            border-top: 2px dashed #eee;
        }
        .add-admin-row input {
            flex: 1; padding: 0.6rem 0.8rem; border: 2px solid #eee; border-radius: 8px;
            font-family: 'Nunito', sans-serif; font-size: 0.85rem; outline: none;
        }
        .add-admin-row input:focus { border-color: #3498db; }
        .btn-add-admin {
            background: #27ae60; color: #fff; border: none; padding: 0.6rem 1.2rem;
            border-radius: 8px; cursor: pointer; font-family: 'Nunito', sans-serif;
            font-weight: 700; font-size: 0.85rem; white-space: nowrap; transition: all 0.15s;
        }
        .btn-add-admin:hover { background: #219a52; }

        /* Offers Panel */
        .offers-panel {
            display: none; max-width: 1200px; margin: 0 auto 1.5rem;
            padding: 0 1.5rem;
        }
        .offers-panel.active { display: block; }

        .offers-panel-card {
            background: #fff; border-radius: 14px; overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .offers-panel-header {
            padding: 1rem 1.5rem; border-bottom: 1px solid #f0f0f0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .offers-panel-header h3 { font-size: 1rem; font-weight: 700; color: #222; }
        .btn-new-offer {
            background: linear-gradient(135deg, #e65100, #ff9800); color: #fff;
            border: none; padding: 0.5rem 1.2rem; border-radius: 8px; cursor: pointer;
            font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.82rem;
            transition: all 0.2s;
        }
        .btn-new-offer:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,152,0,0.3); }

        .offers-panel-body { padding: 1.25rem 1.5rem; }
        .offers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }

        .offer-card {
            border-radius: 12px; overflow: hidden;
            border: 2px solid #f0f0f0; transition: all 0.2s;
        }
        .offer-card:hover { border-color: #e0e0e0; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .offer-card.inactive { opacity: 0.6; }

        .offer-card-top {
            padding: 1rem 1.25rem;
            background: linear-gradient(135deg, #fff3e0, #fff8e1);
        }
        .offer-card.inactive .offer-card-top { background: #f5f5f5; }

        .offer-card-top-row {
            display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.4rem;
        }
        .offer-name { font-size: 1rem; font-weight: 800; color: #333; }
        .offer-badge {
            font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.5rem;
            border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .offer-badge.active-b { background: #e8f5e9; color: #2e7d32; }
        .offer-badge.inactive-b { background: #eee; color: #999; }

        .offer-discount-display {
            font-size: 1.8rem; font-weight: 800; color: #e65100;
            margin: 0.3rem 0;
        }
        .offer-card.inactive .offer-discount-display { color: #999; }

        .offer-card-details { padding: 0.75rem 1.25rem; }
        .offer-detail-row {
            display: flex; justify-content: space-between; font-size: 0.82rem;
            padding: 0.25rem 0; color: #666;
        }
        .offer-detail-row .val { font-weight: 700; color: #333; }

        .offer-card-actions {
            padding: 0.6rem 1.25rem; background: #fafafa;
            display: flex; justify-content: flex-end; gap: 0.5rem;
            border-top: 1px solid #f0f0f0;
        }
        .offer-card-actions button {
            padding: 0.35rem 0.8rem; border-radius: 6px; border: none; cursor: pointer;
            font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.75rem;
            transition: all 0.15s;
        }
        .btn-toggle-offer { background: #fff3e0; color: #f57f17; }
        .btn-toggle-offer:hover { background: #ffe0b2; }
        .btn-toggle-offer.activate { background: #e8f5e9; color: #2e7d32; }
        .btn-toggle-offer.activate:hover { background: #c8e6c9; }
        .btn-edit-offer { background: #e3f2fd; color: #1565c0; }
        .btn-edit-offer:hover { background: #bbdefb; }
        .btn-delete-offer { background: #fce4ec; color: #c62828; }
        .btn-delete-offer:hover { background: #f8bbd0; }

        .no-offers {
            text-align: center; padding: 2rem; color: #bbb; font-size: 0.9rem;
        }
        .no-offers i { font-size: 2rem; display: block; margin-bottom: 0.5rem; color: #ddd; }

        .toast {
            position: fixed; bottom: 2rem; right: 2rem; background: #333; color: #fff;
            padding: 0.8rem 1.5rem; border-radius: 10px; font-size: 0.85rem; z-index: 99999;
            opacity: 0; transform: translateY(20px); transition: all .3s;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: 1fr; }
            .customer-info { gap: 1rem; }
            .add-admin-row { flex-direction: column; }
            .order-card-header { flex-direction: column; align-items: flex-start; }
            .form-row { flex-direction: column; gap: 0; }
            .offers-grid { grid-template-columns: 1fr; }
            .admin-list-item { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="page-header">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
    <h1><i class="fas fa-clipboard-list"></i> All Orders</h1>
    <button class="admin-toggle-btn" id="admin-btn" onclick="openLoginModal()">
        <i class="fas fa-user-shield"></i> Admin
    </button>
</div>

<div class="stats-row">
    <div class="stat-card">
        <div class="stat-label">Total Orders</div>
        <div class="stat-value orders" id="stat-orders">-</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Total Revenue</div>
        <div class="stat-value revenue" id="stat-revenue">-</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Items Sold</div>
        <div class="stat-value items" id="stat-items">-</div>
    </div>
</div>

<!-- Admin Panel (super admin only) -->
<div class="admin-panel" id="admin-panel">
    <div class="admin-panel-card">
        <div class="admin-panel-header">
            <h3><i class="fas fa-users-cog"></i> Admin Management</h3>
        </div>
        <div class="admin-panel-body">
            <div id="admin-list"></div>
            <div class="add-admin-row">
                <input type="email" id="new-admin-email" placeholder="New admin email">
                <input type="password" id="new-admin-pass" placeholder="Password">
                <button class="btn-add-admin" onclick="addAdmin()">
                    <i class="fas fa-plus"></i> Add Admin
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Offers Panel (admins with permission + super admin) -->
<div class="offers-panel" id="offers-panel">
    <div class="offers-panel-card">
        <div class="offers-panel-header">
            <h3><i class="fas fa-tags"></i> Offers & Discounts</h3>
            <button class="btn-new-offer" onclick="openOfferModal()">
                <i class="fas fa-plus"></i> New Offer
            </button>
        </div>
        <div class="offers-panel-body">
            <div class="offers-grid" id="offers-list"></div>
        </div>
    </div>
</div>

<div class="container">
    <div id="orders-container">
        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i> Loading orders...
        </div>
    </div>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="login-modal">
    <div class="modal">
        <div class="modal-header">
            <h2><i class="fas fa-user-shield"></i> Admin Login</h2>
            <button class="modal-close" onclick="closeLoginModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="modal-error" id="login-error"></div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="admin@email.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="Password">
            </div>
            <button class="modal-btn login" onclick="adminLogin()">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </div>
    </div>
</div>

<!-- Add Admin Modal -->
<div class="modal-overlay" id="add-admin-modal">
    <div class="modal">
        <div class="modal-header">
            <h2><i class="fas fa-user-plus"></i> Add New Admin</h2>
            <button class="modal-close" onclick="closeAddAdminModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="modal-error" id="add-error"></div>
            <div class="modal-success" id="add-success"></div>
            <div class="input-group">
                <label>Admin Email</label>
                <input type="email" id="add-email" placeholder="newadmin@email.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="add-pass" placeholder="Set a password">
            </div>
            <button class="modal-btn success" onclick="createNewAdmin()">
                <i class="fas fa-user-plus"></i> Create Admin Account
            </button>
        </div>
    </div>
</div>

<!-- Create Offer Modal -->
<div class="modal-overlay" id="offer-modal">
    <div class="modal">
        <div class="modal-header">
            <h2><i class="fas fa-tags"></i> <span id="offer-modal-title">Create New Offer</span></h2>
            <button class="modal-close" onclick="closeOfferModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="modal-error" id="offer-error"></div>
            <div class="modal-success" id="offer-success"></div>
            <input type="hidden" id="offer-edit-id" value="">
            <div class="input-group">
                <label>Offer Name</label>
                <input type="text" id="offer-name" placeholder="e.g. Summer Special, Weekend Deal">
            </div>
            <div class="form-row">
                <div class="input-group">
                    <label>Discount Type</label>
                    <select id="offer-type">
                        <option value="percentage">Percentage (%)</option>
                        <option value="flat">Flat Amount (₹)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Discount Value</label>
                    <input type="number" id="offer-value" placeholder="e.g. 20" min="1">
                </div>
            </div>
            <div class="input-group">
                <label>Minimum Order Amount (₹)</label>
                <input type="number" id="offer-min" placeholder="e.g. 100 (0 for no minimum)" min="0">
            </div>
            <div class="input-group">
                <label>Description (optional)</label>
                <input type="text" id="offer-desc" placeholder="e.g. Get 20% off on orders above ₹100">
            </div>
            <button class="modal-btn offer-btn" onclick="saveOffer()">
                <i class="fas fa-check"></i> <span id="offer-save-text">Create Offer</span>
            </button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    firebase.initializeApp({
        apiKey: "AIzaSyDq6_tH9wDCuUJUrg1kkkQphCY7MM4tDlw",
        authDomain: "food-ordering-886f0.firebaseapp.com",
        projectId: "food-ordering-886f0",
        storageBucket: "food-ordering-886f0.firebasestorage.app",
        messagingSenderId: "996591308228",
        appId: "1:996591308228:web:461c3007a6b65955452891"
    });
    var db = firebase.firestore();

    var isAdmin = false;
    var currentAdminEmail = null;
    var isSuperAdmin = false;
    var canManageOffers = false;

    var emojiMap = {
        'Samosa': '🥟', 'Papri Chaat': '🍽️', 'Chaat': '🍛',
        'Maggi': '🍜', 'Cake': '🎂', 'Ice Cream': '🍦',
        'Tasty Burger': '🍔', 'Tasty Cakes': '🧁', 'Tasty Sweets': '🍬',
        'Tasty Cupcakes': '🧁', 'Cold Drinks': '🥤', 'Cold Ice-Cream': '🍦'
    };

    function maskEmail(email) {
        if (!email) return '-';
        var parts = email.split('@');
        if (parts[0].length <= 3) return parts[0][0] + '...@' + parts[1];
        return parts[0].substring(0, 3) + '...@' + parts[1];
    }

    function maskPhone(phone) {
        if (!phone) return '-';
        phone = String(phone);
        if (phone.length <= 5) return phone;
        return phone.substring(0, 5) + 'xxxxx';
    }

    function seedSuperAdmin() {
        db.collection('admins').doc('kkumar2k100@gmail.com').get().then(function(doc) {
            if (!doc.exists) {
                db.collection('admins').doc('kkumar2k100@gmail.com').set({
                    email: 'kkumar2k100@gmail.com',
                    password: 'Kshaditij@123',
                    role: 'super_admin',
                    can_manage_offers: true,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        });
    }
    seedSuperAdmin();

    /* ─── Login / Logout ─── */

    function openLoginModal() {
        if (isAdmin) { adminLogout(); return; }
        document.getElementById('login-modal').classList.add('active');
        document.getElementById('login-error').classList.remove('show');
    }
    function closeLoginModal() { document.getElementById('login-modal').classList.remove('active'); }
    function closeAddAdminModal() { document.getElementById('add-admin-modal').classList.remove('active'); }

    function adminLogin() {
        var email = document.getElementById('login-email').value.trim();
        var pass = document.getElementById('login-pass').value;
        var errEl = document.getElementById('login-error');

        if (!email || !pass) {
            errEl.textContent = 'Please enter email and password';
            errEl.classList.add('show');
            return;
        }
        errEl.classList.remove('show');

        db.collection('admins').doc(email).get().then(function(doc) {
            if (!doc.exists) {
                errEl.textContent = 'Admin account not found';
                errEl.classList.add('show');
                return;
            }
            var d = doc.data();
            if (d.password !== pass) {
                errEl.textContent = 'Wrong password. Try again.';
                errEl.classList.add('show');
                return;
            }
            isAdmin = true;
            currentAdminEmail = email;
            isSuperAdmin = d.role === 'super_admin';
            canManageOffers = isSuperAdmin || d.can_manage_offers === true;
            sessionStorage.setItem('adminEmail', email);
            closeLoginModal();
            updateAdminUI();
            loadOrders();
            if (isSuperAdmin) loadAdmins();
            if (canManageOffers) loadOffers();
            showToast('Welcome, Admin!');
        });
    }

    function adminLogout() {
        isAdmin = false;
        currentAdminEmail = null;
        isSuperAdmin = false;
        canManageOffers = false;
        sessionStorage.removeItem('adminEmail');
        updateAdminUI();
        loadOrders();
        showToast('Logged out');
    }

    function updateAdminUI() {
        var btn = document.getElementById('admin-btn');
        var panel = document.getElementById('admin-panel');
        var offersPanel = document.getElementById('offers-panel');
        if (isAdmin) {
            btn.innerHTML = '<i class="fas fa-sign-out-alt"></i> Logout';
            btn.classList.add('logged-in');
            if (isSuperAdmin) panel.classList.add('active');
            else panel.classList.remove('active');
            if (canManageOffers) offersPanel.classList.add('active');
            else offersPanel.classList.remove('active');
        } else {
            btn.innerHTML = '<i class="fas fa-user-shield"></i> Admin';
            btn.classList.remove('logged-in');
            panel.classList.remove('active');
            offersPanel.classList.remove('active');
        }
    }

    /* ─── Admin Management (super admin) ─── */

    function loadAdmins() {
        db.collection('admins').onSnapshot(function(snapshot) {
            var html = '';
            snapshot.forEach(function(doc) {
                var admin = doc.data();
                var roleClass = admin.role === 'super_admin' ? 'super' : 'admin';
                var roleLabel = admin.role === 'super_admin' ? 'Super Admin' : 'Admin';
                var controlsHtml = '';

                if (isSuperAdmin && admin.role !== 'super_admin') {
                    var checked = admin.can_manage_offers ? 'checked' : '';
                    controlsHtml +=
                        '<label class="perm-toggle">' +
                        '<input type="checkbox" ' + checked + ' onchange="toggleOfferPerm(\'' + admin.email + '\', this.checked)">' +
                        ' Offers' +
                        '</label>';
                    controlsHtml += '<button class="btn-remove-admin" onclick="removeAdmin(\'' + admin.email + '\')"><i class="fas fa-trash"></i></button>';
                }

                html +=
                    '<div class="admin-list-item">' +
                    '<span class="admin-email">' + admin.email + '</span>' +
                    '<div class="admin-controls">' +
                    '<span class="admin-role ' + roleClass + '">' + roleLabel + '</span>' +
                    controlsHtml +
                    '</div></div>';
            });
            document.getElementById('admin-list').innerHTML = html;
        });
    }

    function addAdmin() {
        document.getElementById('add-admin-modal').classList.add('active');
        document.getElementById('add-error').classList.remove('show');
        document.getElementById('add-success').classList.remove('show');
        document.getElementById('add-email').value = '';
        document.getElementById('add-pass').value = '';
    }

    function createNewAdmin() {
        var email = document.getElementById('add-email').value.trim();
        var pass = document.getElementById('add-pass').value;
        var errEl = document.getElementById('add-error');
        var sucEl = document.getElementById('add-success');

        errEl.classList.remove('show');
        sucEl.classList.remove('show');

        if (!email || !pass) { errEl.textContent = 'Enter email and password'; errEl.classList.add('show'); return; }
        if (pass.length < 6) { errEl.textContent = 'Password must be at least 6 characters'; errEl.classList.add('show'); return; }

        db.collection('admins').doc(email).set({
            email: email,
            password: pass,
            role: 'admin',
            can_manage_offers: false,
            createdBy: currentAdminEmail,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function() {
            sucEl.textContent = 'Admin added: ' + email;
            sucEl.classList.add('show');
            showToast('Admin added: ' + email);
            document.getElementById('add-email').value = '';
            document.getElementById('add-pass').value = '';
        });
    }

    function removeAdmin(email) {
        if (!confirm('Remove ' + email + ' from admins?')) return;
        db.collection('admins').doc(email).delete().then(function() {
            showToast(email + ' removed');
        });
    }

    function toggleOfferPerm(email, val) {
        db.collection('admins').doc(email).update({ can_manage_offers: val }).then(function() {
            showToast(email + ': offers ' + (val ? 'enabled' : 'disabled'));
        });
    }

    /* ─── Offers Management ─── */

    function openOfferModal(editId) {
        document.getElementById('offer-error').classList.remove('show');
        document.getElementById('offer-success').classList.remove('show');
        document.getElementById('offer-edit-id').value = '';
        document.getElementById('offer-name').value = '';
        document.getElementById('offer-type').value = 'percentage';
        document.getElementById('offer-value').value = '';
        document.getElementById('offer-min').value = '';
        document.getElementById('offer-desc').value = '';

        if (editId) {
            document.getElementById('offer-modal-title').textContent = 'Edit Offer';
            document.getElementById('offer-save-text').textContent = 'Update Offer';
            document.getElementById('offer-edit-id').value = editId;
            db.collection('offers').doc(editId).get().then(function(doc) {
                if (doc.exists) {
                    var o = doc.data();
                    document.getElementById('offer-name').value = o.name || '';
                    document.getElementById('offer-type').value = o.discountType || 'percentage';
                    document.getElementById('offer-value').value = o.discountValue || '';
                    document.getElementById('offer-min').value = o.minOrder || 0;
                    document.getElementById('offer-desc').value = o.description || '';
                }
            });
        } else {
            document.getElementById('offer-modal-title').textContent = 'Create New Offer';
            document.getElementById('offer-save-text').textContent = 'Create Offer';
        }

        document.getElementById('offer-modal').classList.add('active');
    }

    function closeOfferModal() {
        document.getElementById('offer-modal').classList.remove('active');
    }

    function saveOffer() {
        var name = document.getElementById('offer-name').value.trim();
        var type = document.getElementById('offer-type').value;
        var value = Number(document.getElementById('offer-value').value);
        var minOrder = Number(document.getElementById('offer-min').value) || 0;
        var desc = document.getElementById('offer-desc').value.trim();
        var editId = document.getElementById('offer-edit-id').value;
        var errEl = document.getElementById('offer-error');

        errEl.classList.remove('show');

        if (!name) { errEl.textContent = 'Enter offer name'; errEl.classList.add('show'); return; }
        if (!value || value <= 0) { errEl.textContent = 'Enter valid discount value'; errEl.classList.add('show'); return; }
        if (type === 'percentage' && value > 100) { errEl.textContent = 'Percentage cannot be more than 100'; errEl.classList.add('show'); return; }

        var offerData = {
            name: name,
            discountType: type,
            discountValue: value,
            minOrder: minOrder,
            description: desc || (type === 'percentage' ? value + '% off' : '₹' + value + ' off') + (minOrder > 0 ? ' on orders above ₹' + minOrder : ''),
            active: true,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (editId) {
            offerData.updatedBy = currentAdminEmail;
            db.collection('offers').doc(editId).update(offerData).then(function() {
                closeOfferModal();
                showToast('Offer updated!');
            });
        } else {
            offerData.createdBy = currentAdminEmail;
            offerData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            db.collection('offers').add(offerData).then(function() {
                closeOfferModal();
                showToast('Offer created!');
            });
        }
    }

    function toggleOffer(id, currentlyActive) {
        db.collection('offers').doc(id).update({ active: !currentlyActive }).then(function() {
            showToast(currentlyActive ? 'Offer deactivated' : 'Offer activated');
        });
    }

    function deleteOffer(id) {
        if (!confirm('Delete this offer permanently?')) return;
        db.collection('offers').doc(id).delete().then(function() {
            showToast('Offer deleted');
        });
    }

    function loadOffers() {
        db.collection('offers').onSnapshot(function(snapshot) {
            var container = document.getElementById('offers-list');
            if (snapshot.empty) {
                container.innerHTML = '<div class="no-offers"><i class="fas fa-tags"></i>No offers yet. Create one!</div>';
                return;
            }
            var html = '';
            snapshot.forEach(function(doc) {
                var o = doc.data();
                var isActive = o.active !== false;
                var discountDisplay = o.discountType === 'percentage'
                    ? o.discountValue + '% OFF'
                    : '₹' + o.discountValue + ' OFF';
                var toggleClass = isActive ? '' : 'activate';
                var toggleIcon = isActive ? 'fa-pause' : 'fa-play';
                var toggleLabel = isActive ? 'Deactivate' : 'Activate';

                html +=
                    '<div class="offer-card ' + (isActive ? '' : 'inactive') + '">' +
                    '<div class="offer-card-top">' +
                    '<div class="offer-card-top-row">' +
                    '<span class="offer-name">' + o.name + '</span>' +
                    '<span class="offer-badge ' + (isActive ? 'active-b' : 'inactive-b') + '">' + (isActive ? 'Active' : 'Inactive') + '</span>' +
                    '</div>' +
                    '<div class="offer-discount-display">' + discountDisplay + '</div>' +
                    '</div>' +
                    '<div class="offer-card-details">' +
                    '<div class="offer-detail-row"><span>Min Order</span><span class="val">' + (o.minOrder > 0 ? '₹' + o.minOrder : 'No minimum') + '</span></div>' +
                    '<div class="offer-detail-row"><span>Type</span><span class="val">' + (o.discountType === 'percentage' ? 'Percentage' : 'Flat Discount') + '</span></div>' +
                    (o.description ? '<div class="offer-detail-row"><span>Details</span><span class="val">' + o.description + '</span></div>' : '') +
                    '<div class="offer-detail-row"><span>Created By</span><span class="val">' + (o.createdBy || '-') + '</span></div>' +
                    '</div>' +
                    '<div class="offer-card-actions">' +
                    '<button class="btn-edit-offer" onclick="openOfferModal(\'' + doc.id + '\')"><i class="fas fa-edit"></i> Edit</button>' +
                    '<button class="btn-toggle-offer ' + toggleClass + '" onclick="toggleOffer(\'' + doc.id + '\',' + isActive + ')"><i class="fas ' + toggleIcon + '"></i> ' + toggleLabel + '</button>' +
                    '<button class="btn-delete-offer" onclick="deleteOffer(\'' + doc.id + '\')"><i class="fas fa-trash"></i></button>' +
                    '</div>' +
                    '</div>';
            });
            container.innerHTML = html;
        });
    }

    /* ─── Orders ─── */

    function cancelOrder(orderId) {
        if (!confirm('Cancel order ' + orderId + '?')) return;
        db.collection('orders').doc(orderId).update({ status: 'cancelled' }).then(function() {
            showToast('Order ' + orderId + ' cancelled');
        });
    }

    function restoreOrder(orderId) {
        db.collection('orders').doc(orderId).update({ status: 'confirmed' }).then(function() {
            showToast('Order ' + orderId + ' restored');
        });
    }

    function deleteOrder(orderId) {
        if (!confirm('Permanently delete order ' + orderId + '? This cannot be undone.')) return;
        db.collection('orders').doc(orderId).delete().then(function() {
            showToast('Order ' + orderId + ' deleted');
        });
    }

    function loadOrders() {
        db.collection('orders').orderBy('timestamp', 'desc').onSnapshot(function(snapshot) {
            var container = document.getElementById('orders-container');
            var totalOrders = 0, totalRevenue = 0, totalItems = 0;

            if (snapshot.empty) {
                container.innerHTML = '<div class="no-orders"><i class="fas fa-shopping-basket"></i><p>No orders yet</p></div>';
                document.getElementById('stat-orders').textContent = '0';
                document.getElementById('stat-revenue').textContent = '₹0';
                document.getElementById('stat-items').textContent = '0';
                return;
            }

            var html = '<div class="orders-list">';

            snapshot.forEach(function(doc) {
                var order = doc.data();
                var status = order.status || 'confirmed';
                if (status !== 'cancelled') {
                    totalOrders++;
                    totalRevenue += order.totalAmount || 0;
                }

                var customerName = order.customerName || '-';
                var customerEmail = isAdmin ? (order.customerEmail || '-') : maskEmail(order.customerEmail);
                var customerPhone = isAdmin ? (order.customerPhone || '-') : maskPhone(order.customerPhone);

                var statusClass = status === 'cancelled' ? 'cancelled' : 'confirmed';

                var itemsHtml = '';
                if (order.items) {
                    order.items.forEach(function(item) {
                        if (status !== 'cancelled') totalItems += item.qty || 0;
                        var emoji = emojiMap[item.name] || '🍴';
                        itemsHtml +=
                            '<div class="order-items-row">' +
                            '<span>' + emoji + '</span>' +
                            '<span class="oi-name">' + item.name + '</span>' +
                            '<span class="oi-qty">x' + item.qty + '</span>' +
                            '<span class="oi-price">₹' + item.subtotal + '</span>' +
                            '</div>';
                    });
                }

                var adminBtns = '';
                if (isAdmin) {
                    if (status === 'confirmed') {
                        adminBtns =
                            '<div class="admin-actions">' +
                            '<button class="btn-cancel-order" onclick="cancelOrder(\'' + order.orderId + '\')"><i class="fas fa-ban"></i> Cancel</button>' +
                            '<button class="btn-delete-order" onclick="deleteOrder(\'' + order.orderId + '\')"><i class="fas fa-trash"></i> Delete</button>' +
                            '</div>';
                    } else {
                        adminBtns =
                            '<div class="admin-actions">' +
                            '<button class="btn-restore-order" onclick="restoreOrder(\'' + order.orderId + '\')"><i class="fas fa-undo"></i> Restore</button>' +
                            '<button class="btn-delete-order" onclick="deleteOrder(\'' + order.orderId + '\')"><i class="fas fa-trash"></i> Delete</button>' +
                            '</div>';
                    }
                }

                html +=
                    '<div class="order-card">' +
                    '<div class="order-card-header">' +
                    '<span class="order-id-tag">' + order.orderId + '</span>' +
                    '<span class="order-date"><i class="far fa-clock"></i> ' + (order.orderDate || '') + '</span>' +
                    '<span class="order-status ' + statusClass + '">' + status + '</span>' +
                    '</div>' +
                    '<div class="order-card-body">' +
                    '<div class="customer-info">' +
                    '<div class="info-item"><div class="info-label">Customer</div><div class="info-value">' + customerName + '</div></div>' +
                    '<div class="info-item"><div class="info-label">Email</div><div class="info-value">' + customerEmail + '</div></div>' +
                    '<div class="info-item"><div class="info-label">Phone</div><div class="info-value">' + customerPhone + '</div></div>' +
                    '</div>' +
                    itemsHtml +
                    '</div>' +
                    '<div class="order-card-footer">' +
                    '<div><span class="order-total-label">Total</span> <span class="order-total-amount">₹' + (order.totalAmount || 0) + '</span></div>' +
                    adminBtns +
                    '</div>' +
                    '</div>';
            });

            html += '</div>';
            container.innerHTML = html;
            document.getElementById('stat-orders').textContent = totalOrders;
            document.getElementById('stat-revenue').textContent = '₹' + totalRevenue;
            document.getElementById('stat-items').textContent = totalItems;
        });
    }

    /* ─── Session restore ─── */

    function checkSavedSession() {
        var savedEmail = sessionStorage.getItem('adminEmail');
        if (savedEmail) {
            db.collection('admins').doc(savedEmail).get().then(function(doc) {
                if (doc.exists) {
                    var d = doc.data();
                    isAdmin = true;
                    currentAdminEmail = savedEmail;
                    isSuperAdmin = d.role === 'super_admin';
                    canManageOffers = isSuperAdmin || d.can_manage_offers === true;
                    updateAdminUI();
                    loadOrders();
                    if (isSuperAdmin) loadAdmins();
                    if (canManageOffers) loadOffers();
                }
            });
        }
    }

    function showToast(msg) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 2000);
    }

    checkSavedSession();
    loadOrders();
</script>
</body>
</html>
