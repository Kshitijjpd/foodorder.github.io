<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cart & Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fef2f2 50%, #fff 100%);
            min-height: 100vh;
            color: #333;
        }

        .page-header {
            background: linear-gradient(135deg, #ff3838, #ff6b35);
            color: #fff;
            text-align: center;
            padding: 2rem 1rem;
            position: relative;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .page-header p {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-top: 0.3rem;
        }

        .page-header .back-link {
            position: absolute;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            text-decoration: none;
            font-size: 1.4rem;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .page-header .back-link:hover {
            opacity: 1;
        }

        .main-container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card-header i {
            font-size: 1.3rem;
            color: #ff3838;
        }

        .card-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #222;
        }

        .card-body {
            padding: 1.5rem;
        }

        /* Cart Section */
        .cart-item {
            display: grid;
            grid-template-columns: auto 1fr auto auto auto;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .cart-item:last-of-type {
            border-bottom: none;
        }

        .item-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .item-icon.samosa { background: #fff3e0; }
        .item-icon.papri { background: #e8f5e9; }
        .item-icon.chaat { background: #fce4ec; }
        .item-icon.maggi { background: #fff8e1; }
        .item-icon.cake { background: #f3e5f5; }
        .item-icon.icecream { background: #e0f7fa; }

        .item-details {
            min-width: 0;
        }

        .item-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #333;
        }

        .item-price-tag {
            font-size: 0.8rem;
            color: #999;
        }

        .cart-item input[type="search"] {
            display: none;
        }

        .cart-item input[type="number"] {
            width: 55px;
            padding: 0.4rem 0.5rem;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Nunito', sans-serif;
            text-align: center;
            transition: border-color 0.2s;
            outline: none;
        }

        .cart-item input[type="number"]:focus {
            border-color: #ff3838;
        }

        .cart-item input[type="button"] {
            background: linear-gradient(135deg, #ff3838, #ff6b35);
            color: #fff;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .cart-item input[type="button"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 56, 56, 0.3);
        }

        .cart-item input[type="button"]:active {
            transform: translateY(0);
        }

        .item-subtotal {
            font-weight: 700;
            font-size: 0.95rem;
            color: #ff3838;
            min-width: 60px;
            text-align: right;
        }

        .total-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px dashed #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-section .total-btn {
            background: #222;
            color: #fff;
            border: none;
            padding: 0.65rem 1.8rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.15s;
        }

        .total-section .total-btn:hover {
            background: #ff3838;
            transform: translateY(-1px);
        }

        .total-amount {
            font-size: 1.5rem;
            font-weight: 800;
            color: #222;
        }

        /* Payment Section */
        .accepted-cards {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .accepted-cards i {
            font-size: 2.2rem;
            padding: 0.5rem;
            border-radius: 6px;
            background: #f8f8f8;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #555;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            color: #333;
        }

        .form-group input[type="text"]:focus {
            border-color: #ff3838;
            box-shadow: 0 0 0 3px rgba(255, 56, 56, 0.1);
        }

        .form-group input[type="text"]::placeholder {
            color: #bbb;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1.25rem 0;
            font-size: 0.9rem;
            color: #555;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ff3838;
            cursor: pointer;
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ff3838, #ff6b35);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: transform 0.15s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 56, 56, 0.35);
        }

        .checkout-btn:active {
            transform: translateY(0);
        }

        .secure-note {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #aaa;
        }

        .secure-note i {
            margin-right: 0.3rem;
        }

        .error {
            color: #ff3838;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                padding: 0 1rem 2rem;
            }

            .cart-section {
                order: -1;
            }

            .page-header .back-link {
                position: static;
                display: block;
                transform: none;
                margin-bottom: 0.5rem;
                font-size: 1rem;
            }

            .cart-item {
                grid-template-columns: auto 1fr;
                gap: 0.5rem;
            }

            .cart-item input[type="number"],
            .cart-item input[type="button"],
            .item-subtotal {
                grid-column: 2;
            }

            .cart-item .item-controls {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="page-header">
    <a href="index.html" class="back-link"><i class="fa fa-arrow-left"></i> Back</a>
    <h1><i class="fa fa-shopping-cart"></i> Cart & Checkout</h1>
    <p>Review your order and complete payment</p>
</div>

<div class="main-container">

    <!-- Cart Section -->
    <div class="card cart-section">
        <div class="card-header">
            <i class="fa fa-shopping-bag"></i>
            <h2>Your Order</h2>
        </div>
        <div class="card-body">
            <form>
                <div class="cart-item">
                    <div class="item-icon samosa">🥟</div>
                    <div class="item-details">
                        <div class="item-name">Samosa</div>
                        <div class="item-price-tag">₹10 each</div>
                    </div>
                    <input type="search" list="FOOD1">
                    <input type="number" id="firstNumber" min="0" placeholder="Qty">
                    <input type="button" onClick="multiplyBy()" value="ADD">
                    <span class="item-subtotal" id="result1"></span>
                </div>

                <div class="cart-item">
                    <div class="item-icon papri">🍽️</div>
                    <div class="item-details">
                        <div class="item-name">Papri Chaat</div>
                        <div class="item-price-tag">₹20 each</div>
                    </div>
                    <input type="search" list="FOOD2">
                    <input type="number" id="secondNumber" min="0" placeholder="Qty">
                    <input type="button" onClick="multiplyBy1()" value="ADD">
                    <span class="item-subtotal" id="results"></span>
                </div>

                <div class="cart-item">
                    <div class="item-icon chaat">🍛</div>
                    <div class="item-details">
                        <div class="item-name">Chaat</div>
                        <div class="item-price-tag">₹30 each</div>
                    </div>
                    <input type="search" list="FOOD3">
                    <input type="number" id="thirdNumber" min="0" placeholder="Qty">
                    <input type="button" onClick="multiplyBy2()" value="ADD">
                    <span class="item-subtotal" id="result3"></span>
                </div>

                <div class="cart-item">
                    <div class="item-icon maggi">🍜</div>
                    <div class="item-details">
                        <div class="item-name">Maggi</div>
                        <div class="item-price-tag">₹40 each</div>
                    </div>
                    <input type="search" list="FOOD4">
                    <input type="number" id="forthNumber" min="0" placeholder="Qty">
                    <input type="button" onClick="multiplyBy3()" value="ADD">
                    <span class="item-subtotal" id="result4"></span>
                </div>

                <div class="cart-item">
                    <div class="item-icon cake">🎂</div>
                    <div class="item-details">
                        <div class="item-name">Cake</div>
                        <div class="item-price-tag">₹60 each</div>
                    </div>
                    <input type="search" list="FOOD5">
                    <input type="number" id="fiveNumber" min="0" placeholder="Qty">
                    <input type="button" onClick="multiplyBy4()" value="ADD">
                    <span class="item-subtotal" id="result5"></span>
                </div>

                <div class="cart-item">
                    <div class="item-icon icecream">🍦</div>
                    <div class="item-details">
                        <div class="item-name">Ice Cream</div>
                        <div class="item-price-tag">₹70 each</div>
                    </div>
                    <input type="search" list="FOOD6">
                    <input type="number" id="sixNumber" min="0" placeholder="Qty">
                    <input type="button" onClick="multiplyBy5()" value="ADD">
                    <span class="item-subtotal" id="result6"></span>
                </div>

                <datalist id="FOOD1"><option value="SAMOSA : 10rs">10</option></datalist>
                <datalist id="FOOD2"><option value="Papri: 20rs">20</option></datalist>
                <datalist id="FOOD3"><option value="CHAAT: 30rs">30</option></datalist>
                <datalist id="FOOD4"><option value="MAGGI: 40rs">40</option></datalist>
                <datalist id="FOOD5"><option value="CAKE: 60rs">60</option></datalist>
                <datalist id="FOOD6"><option value="ICE CREAM: 70rs">70</option></datalist>
            </form>

            <div class="total-section">
                <input type="button" onClick="multiplyBy78()" value="Calculate Total" class="total-btn">
                <div class="total-amount">₹<span id="result78">0</span></div>
            </div>
        </div>
    </div>

    <!-- Payment Section -->
    <div class="card">
        <div class="card-header">
            <i class="fa fa-credit-card"></i>
            <h2>Payment Details</h2>
        </div>
        <div class="card-body">
            <form id="validate" action="/action_page.php">
                <div class="accepted-cards">
                    <i class="fa fa-cc-visa" style="color:#1a1f71;"></i>
                    <i class="fa fa-cc-amex" style="color:#2e77bc;"></i>
                    <i class="fa fa-cc-mastercard" style="color:#eb001b;"></i>
                    <i class="fa fa-cc-discover" style="color:#ff6000;"></i>
                </div>

                <div class="form-group">
                    <label for="cname">Name on Card</label>
                    <input type="text" id="cname" name="cardname" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="ccnum">Card Number</label>
                    <input type="text" id="ccnum" name="cardnumber" placeholder="1234 5678 9012 3456" required>
                </div>

                <div class="form-group">
                    <label for="expmonth">Expiry Month</label>
                    <input type="text" id="expmonth" name="expmonth" placeholder="MM" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="expyear">Expiry Year</label>
                        <input type="text" id="expyear" name="expyear" placeholder="YYYY" required>
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" name="cvv" placeholder="123" required>
                    </div>
                </div>

                <label class="checkbox-group">
                    <input type="checkbox" checked="checked" name="sameadr">
                    Shipping address same as billing
                </label>

                <input type="submit" value="Continue to Checkout" class="checkout-btn">

                <div class="secure-note">
                    <i class="fa fa-lock"></i> Your payment information is secure
                </div>
            </form>
        </div>
    </div>

</div>

<script>
    function multiplyBy() {
        var num1 = document.getElementById("firstNumber").value;
        document.getElementById("result1").innerHTML = "₹" + (num1 * 10);
    }
    function multiplyBy1() {
        var num2 = document.getElementById("secondNumber").value;
        document.getElementById("results").innerHTML = "₹" + (num2 * 20);
    }
    function multiplyBy2() {
        var num3 = document.getElementById("thirdNumber").value;
        document.getElementById("result3").innerHTML = "₹" + (num3 * 30);
    }
    function multiplyBy3() {
        var num4 = document.getElementById("forthNumber").value;
        document.getElementById("result4").innerHTML = "₹" + (num4 * 40);
    }
    function multiplyBy4() {
        var num5 = document.getElementById("fiveNumber").value;
        document.getElementById("result5").innerHTML = "₹" + (num5 * 60);
    }
    function multiplyBy5() {
        var num6 = document.getElementById("sixNumber").value;
        document.getElementById("result6").innerHTML = "₹" + (num6 * 70);
    }
    function multiplyBy78() {
        var num1 = Number(document.getElementById("firstNumber").value) || 0;
        var num2 = Number(document.getElementById("secondNumber").value) || 0;
        var num3 = Number(document.getElementById("thirdNumber").value) || 0;
        var num4 = Number(document.getElementById("forthNumber").value) || 0;
        var num5 = Number(document.getElementById("fiveNumber").value) || 0;
        var num6 = Number(document.getElementById("sixNumber").value) || 0;
        var total = num1 * 10 + num2 * 20 + num3 * 30 + num4 * 40 + num5 * 60 + num6 * 70;
        document.getElementById("result78").innerHTML = total;
    }
</script>
</body>
</html>
