<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cart & Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            color: #333;
        }

        .page-header {
            background: linear-gradient(135deg, #ff3838, #ff6b35);
            color: #fff;
            text-align: center;
            padding: 1.5rem 1rem;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .page-header p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 0.25rem;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .header-nav a:hover {
            opacity: 1;
        }

        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .card-header i {
            font-size: 1.2rem;
            color: #ff3838;
        }

        .card-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #222;
        }

        .item-count-badge {
            background: #ff3838;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
        }

        .card-body {
            padding: 1rem 1.5rem 1.5rem;
        }

        /* Empty cart */
        .empty-cart {
            text-align: center;
            padding: 3rem 1rem;
            color: #aaa;
        }

        .empty-cart i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ddd;
        }

        .empty-cart p {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .empty-cart a {
            color: #ff3838;
            text-decoration: none;
            font-weight: 700;
        }

        /* Cart items */
        .cart-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-emoji {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: #333;
        }

        .item-unit-price {
            font-size: 0.78rem;
            color: #999;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 2px solid #eee;
            background: #fff;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .qty-btn:hover {
            border-color: #ff3838;
            color: #ff3838;
        }

        .qty-value {
            font-weight: 700;
            font-size: 0.95rem;
            min-width: 24px;
            text-align: center;
        }

        .item-subtotal {
            font-weight: 700;
            font-size: 0.95rem;
            color: #ff3838;
            min-width: 55px;
            text-align: right;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.3rem;
            transition: color 0.15s;
        }

        .remove-btn:hover {
            color: #ff3838;
        }

        /* Total */
        .total-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px dashed #eee;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0;
            font-size: 0.9rem;
            color: #777;
        }

        .total-row.grand-total {
            font-size: 1.2rem;
            font-weight: 800;
            color: #222;
            padding-top: 0.7rem;
            margin-top: 0.5rem;
            border-top: 2px solid #eee;
        }

        .clear-cart-btn {
            background: none;
            border: 2px solid #eee;
            color: #999;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .clear-cart-btn:hover {
            border-color: #ff3838;
            color: #ff3838;
        }

        /* Add more items section */
        .add-more-section {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 2px dashed #eee;
        }

        .add-more-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .quick-add-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .quick-add-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.8rem;
            background: #fafafa;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: #555;
            transition: all 0.15s;
        }

        .quick-add-btn:hover {
            border-color: #ff3838;
            background: #fff5f5;
            color: #ff3838;
        }

        .quick-add-btn .qa-emoji {
            font-size: 1.1rem;
        }

        .quick-add-btn .qa-price {
            margin-left: auto;
            font-size: 0.75rem;
            color: #aaa;
        }

        /* Payment Section */
        .accepted-cards {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .accepted-cards i {
            font-size: 2rem;
            padding: 0.4rem 0.5rem;
            border-radius: 6px;
            background: #f8f8f8;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #555;
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: 'Nunito', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            color: #333;
        }

        .form-group input[type="text"]:focus {
            border-color: #ff3838;
            box-shadow: 0 0 0 3px rgba(255, 56, 56, 0.1);
        }

        .form-group input[type="text"]::placeholder {
            color: #bbb;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
            font-size: 0.85rem;
            color: #555;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ff3838;
            cursor: pointer;
        }

        .checkout-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #ff3838, #ff6b35);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: transform 0.15s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 56, 56, 0.35);
        }

        .checkout-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .secure-note {
            text-align: center;
            margin-top: 0.75rem;
            font-size: 0.75rem;
            color: #aaa;
        }

        .secure-note i {
            margin-right: 0.3rem;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #333;
            color: #fff;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            font-size: 0.9rem;
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all .3s;
            box-shadow: 0 5px 20px rgba(0,0,0,.2);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                padding: 0 1rem 2rem;
                margin: 1rem auto;
            }

            .cart-section {
                order: -1;
            }

            .quick-add-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 1.4rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

<div class="page-header">
    <div class="header-nav">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <div>
            <h1><i class="fas fa-shopping-cart"></i> Cart & Checkout</h1>
            <p>Review your order and complete payment</p>
        </div>
        <a href="popular.html"><i class="fas fa-plus"></i> Add More</a>
    </div>
</div>

<div class="main-container">

    <!-- Cart Section -->
    <div class="card cart-section">
        <div class="card-header">
            <div class="card-header-left">
                <i class="fas fa-shopping-bag"></i>
                <h2>Your Order</h2>
            </div>
            <span class="item-count-badge" id="item-count">0 items</span>
        </div>
        <div class="card-body">
            <div id="cart-items"></div>

            <div class="total-section" id="total-section" style="display:none;">
                <div class="total-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="total-row grand-total">
                    <span>Total</span>
                    <span id="grand-total">₹0</span>
                </div>
                <button class="clear-cart-btn" onclick="clearCart()">
                    <i class="fas fa-trash-alt"></i> Clear Cart
                </button>
            </div>

            <!-- Quick add more items -->
            <div class="add-more-section">
                <div class="add-more-title">Quick Add Items</div>
                <div class="quick-add-grid">
                    <button class="quick-add-btn" onclick="quickAdd('Samosa', 10)">
                        <span class="qa-emoji">🥟</span> Samosa <span class="qa-price">₹10</span>
                    </button>
                    <button class="quick-add-btn" onclick="quickAdd('Papri Chaat', 20)">
                        <span class="qa-emoji">🍽️</span> Papri Chaat <span class="qa-price">₹20</span>
                    </button>
                    <button class="quick-add-btn" onclick="quickAdd('Chaat', 30)">
                        <span class="qa-emoji">🍛</span> Chaat <span class="qa-price">₹30</span>
                    </button>
                    <button class="quick-add-btn" onclick="quickAdd('Maggi', 40)">
                        <span class="qa-emoji">🍜</span> Maggi <span class="qa-price">₹40</span>
                    </button>
                    <button class="quick-add-btn" onclick="quickAdd('Cake', 60)">
                        <span class="qa-emoji">🎂</span> Cake <span class="qa-price">₹60</span>
                    </button>
                    <button class="quick-add-btn" onclick="quickAdd('Ice Cream', 70)">
                        <span class="qa-emoji">🍦</span> Ice Cream <span class="qa-price">₹70</span>
                    </button>
                    <button class="quick-add-btn" onclick="quickAdd('Tasty Burger', 25)">
                        <span class="qa-emoji">🍔</span> Burger <span class="qa-price">₹25</span>
                    </button>
                    <button class="quick-add-btn" onclick="quickAdd('Cold Drinks', 10)">
                        <span class="qa-emoji">🥤</span> Cold Drinks <span class="qa-price">₹10</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment Section -->
    <div class="card">
        <div class="card-header">
            <div class="card-header-left">
                <i class="fas fa-credit-card"></i>
                <h2>Payment Details</h2>
            </div>
        </div>
        <div class="card-body">
            <form id="validate" action="/action_page.php">
                <div class="accepted-cards">
                    <i class="fab fa-cc-visa" style="color:#1a1f71;"></i>
                    <i class="fab fa-cc-amex" style="color:#2e77bc;"></i>
                    <i class="fab fa-cc-mastercard" style="color:#eb001b;"></i>
                    <i class="fab fa-cc-discover" style="color:#ff6000;"></i>
                </div>

                <div class="form-group">
                    <label for="cname">Name on Card</label>
                    <input type="text" id="cname" name="cardname" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="ccnum">Card Number</label>
                    <input type="text" id="ccnum" name="cardnumber" placeholder="1234 5678 9012 3456" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="expmonth">Exp Month</label>
                        <input type="text" id="expmonth" name="expmonth" placeholder="MM" required>
                    </div>
                    <div class="form-group">
                        <label for="expyear">Exp Year</label>
                        <input type="text" id="expyear" name="expyear" placeholder="YYYY" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cvv" placeholder="123" required>
                </div>

                <label class="checkbox-group">
                    <input type="checkbox" checked="checked" name="sameadr">
                    Shipping address same as billing
                </label>

                <button type="submit" class="checkout-btn" id="checkout-btn">
                    <i class="fas fa-lock"></i> Pay ₹<span id="pay-amount">0</span>
                </button>

                <div class="secure-note">
                    <i class="fas fa-shield-alt"></i> Your payment information is secure & encrypted
                </div>
            </form>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    var emojiMap = {
        'Samosa': '🥟', 'Papri Chaat': '🍽️', 'Chaat': '🍛',
        'Maggi': '🍜', 'Cake': '🎂', 'Ice Cream': '🍦',
        'Tasty Burger': '🍔', 'Tasty Cakes': '🧁', 'Tasty Sweets': '🍬',
        'Tasty Cupcakes': '🧁', 'Cold Drinks': '🥤', 'Cold Ice-Cream': '🍦'
    };

    var colorMap = {
        'Samosa': '#fff3e0', 'Papri Chaat': '#e8f5e9', 'Chaat': '#fce4ec',
        'Maggi': '#fff8e1', 'Cake': '#f3e5f5', 'Ice Cream': '#e0f7fa',
        'Tasty Burger': '#fff3e0', 'Tasty Cakes': '#fce4ec', 'Tasty Sweets': '#fff8e1',
        'Tasty Cupcakes': '#f3e5f5', 'Cold Drinks': '#e8f5e9', 'Cold Ice-Cream': '#e0f7fa'
    };

    function getCart() {
        return JSON.parse(localStorage.getItem('foodCart') || '[]');
    }

    function saveCart(cart) {
        localStorage.setItem('foodCart', JSON.stringify(cart));
    }

    function renderCart() {
        var cart = getCart();
        var container = document.getElementById('cart-items');
        var totalSection = document.getElementById('total-section');

        if (cart.length === 0) {
            container.innerHTML =
                '<div class="empty-cart">' +
                '<i class="fas fa-shopping-basket"></i>' +
                '<p>Your cart is empty</p>' +
                '<a href="popular.html">Browse Popular Foods <i class="fas fa-arrow-right"></i></a>' +
                '</div>';
            totalSection.style.display = 'none';
            document.getElementById('item-count').textContent = '0 items';
            document.getElementById('pay-amount').textContent = '0';
            document.getElementById('checkout-btn').disabled = true;
            return;
        }

        document.getElementById('checkout-btn').disabled = false;
        var totalQty = 0;
        var totalPrice = 0;
        var html = '';

        for (var i = 0; i < cart.length; i++) {
            var item = cart[i];
            var subtotal = item.price * item.qty;
            totalQty += item.qty;
            totalPrice += subtotal;
            var emoji = emojiMap[item.name] || '🍴';
            var bgColor = colorMap[item.name] || '#f5f5f5';

            html +=
                '<div class="cart-item">' +
                '<div class="item-emoji" style="background:' + bgColor + '">' + emoji + '</div>' +
                '<div class="item-details">' +
                '<div class="item-name">' + item.name + '</div>' +
                '<div class="item-unit-price">₹' + item.price + ' each</div>' +
                '</div>' +
                '<div class="qty-controls">' +
                '<button class="qty-btn" onclick="changeQty(' + i + ', -1)">−</button>' +
                '<span class="qty-value">' + item.qty + '</span>' +
                '<button class="qty-btn" onclick="changeQty(' + i + ', 1)">+</button>' +
                '</div>' +
                '<div class="item-subtotal">₹' + subtotal + '</div>' +
                '<button class="remove-btn" onclick="removeItem(' + i + ')" title="Remove">' +
                '<i class="fas fa-times"></i></button>' +
                '</div>';
        }

        container.innerHTML = html;
        totalSection.style.display = 'block';
        document.getElementById('item-count').textContent = totalQty + ' item' + (totalQty > 1 ? 's' : '');
        document.getElementById('subtotal').textContent = '₹' + totalPrice;
        document.getElementById('grand-total').textContent = '₹' + totalPrice;
        document.getElementById('pay-amount').textContent = totalPrice;
    }

    function changeQty(index, delta) {
        var cart = getCart();
        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
            cart.splice(index, 1);
        }
        saveCart(cart);
        renderCart();
    }

    function removeItem(index) {
        var cart = getCart();
        var name = cart[index].name;
        cart.splice(index, 1);
        saveCart(cart);
        renderCart();
        showToast(name + ' removed from cart');
    }

    function clearCart() {
        localStorage.removeItem('foodCart');
        renderCart();
        showToast('Cart cleared');
    }

    function quickAdd(name, price) {
        var cart = getCart();
        var found = false;
        for (var i = 0; i < cart.length; i++) {
            if (cart[i].name === name) {
                cart[i].qty += 1;
                found = true;
                break;
            }
        }
        if (!found) {
            cart.push({ name: name, price: price, qty: 1 });
        }
        saveCart(cart);
        renderCart();
        showToast(name + ' added!');
    }

    function showToast(msg) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(function() {
            toast.classList.remove('show');
        }, 1500);
    }

    renderCart();
</script>
</body>
</html>
